<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workspace</title>
<style>
  :root{
    --bg:#07090f; --panel:#0e1219; --border:#1c2530; --text:#f4f5f8;
    --dim:#7d8896; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
    --amber:#d29922; --purple:#a371f7; --panel2:#11161f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  a{color:var(--accent);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;
          background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto}
  .project{font-weight:800;letter-spacing:.12em;font-size:11px;color:var(--dim)}
  .crumb{color:var(--dim);font-size:12px}
  .crumb b{color:var(--text)}
  .spacer{flex:1}
  .mode-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .mode-toggle button{background:var(--panel2);color:var(--dim);border:0;padding:6px 16px;
                      font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .mode-toggle button.active{background:var(--accent);color:#000}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);
       border-radius:8px;padding:6px 14px;font-weight:700;font-size:12px;
       cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.danger{color:var(--red);border-color:#5c1f1d}
  .btn.ok{background:var(--green);color:#000;border:0}
  .layout{flex:1;display:grid;grid-template-columns:230px 1fr 300px;min-height:0}
  .side{background:var(--panel);border-right:1px solid var(--border);padding:12px;overflow-y:auto}
  .side.right{border-right:0;border-left:1px solid var(--border)}
  .side h3{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:14px 0 8px}
  .side h3:first-child{margin-top:0}
  .sessions-list{display:flex;flex-direction:column;gap:4px}
  .session-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;
                cursor:pointer;border:1px solid transparent;font-family:inherit}
  .session-item:hover{background:var(--panel2);border-color:var(--border)}
  .session-item.active{background:var(--panel2);border-color:var(--accent);
                       box-shadow:inset 2px 0 0 var(--accent)}
  .session-item .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .session-item .sdot.idle{background:#3a4453}
  .session-item .sdot.working{background:var(--accent);animation:pulse 1.2s infinite}
  .session-item .sdot.waiting{background:var(--amber)}
  .session-item .sdot.handed_off{background:var(--purple)}
  .session-item .sdot.failed{background:var(--red)}
  @keyframes pulse{50%{opacity:.35}}
  .session-item .stitle{flex:1;font-size:11px;font-weight:600;white-space:nowrap;
                        overflow:hidden;text-overflow:ellipsis}
  .session-item .sstatus{font-size:10px;color:var(--purple)}
  .session-item .sactions{display:flex;gap:4px}
  .session-item .sbtn{background:var(--panel2);border:1px solid var(--border);
                      border-radius:4px;padding:2px 6px;font-size:9px;color:var(--dim);
                      cursor:pointer;font-family:inherit}
  .session-item .sbtn:hover{border-color:var(--accent);color:var(--accent)}
  .new-session{display:flex;gap:6px;margin:8px 0;padding:8px;background:var(--panel2);
               border:1px dashed var(--border);border-radius:8px}
  .new-session input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);
                     border-radius:6px;padding:6px 8px;font:inherit;color:var(--text);font-size:12px}
  .new-session button{background:var(--accent);color:#000;border:0;border-radius:6px;
                      padding:0 12px;font-weight:700;cursor:pointer}
  .nav-agent{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
  .nav-agent:hover{background:var(--panel2)}
  .nav-agent.active{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.idle{background:#3a4453}.dot.working{background:var(--accent);animation:pulse 1.2s infinite}
  .dot.waiting{background:var(--amber)}.dot.handed_off{background:var(--purple)}
  .nav-agent .nm{flex:1;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-agent .st{font-size:10px;color:var(--dim)}
  .proj-links{display:flex;flex-direction:column;gap:2px}
  .proj-links a{padding:6px 8px;border-radius:6px;color:var(--dim);font-size:12px}
  .proj-links a:hover{background:var(--panel2);color:var(--text)}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .agent-head{display:flex;align-items:center;gap:10px;padding:10px 16px;
              border-bottom:1px solid var(--border);flex:0 0 auto}
  .agent-head h1{font-size:16px;margin:0}
  .agent-head .role{color:var(--dim);font-size:12px}
  .badge{border:1px solid var(--border);color:var(--dim);border-radius:20px;
         padding:2px 10px;font-size:11px}
  .badge.live{border-color:var(--accent);color:var(--accent);animation:pulse 1.4s infinite}
  .badge.plan{border-color:var(--purple);color:var(--purple)}
  .badge.build{border-color:var(--green);color:var(--green)}
  .handoff-card{border:1px solid var(--purple);border-left:3px solid var(--purple);
                background:#141024;border-radius:8px;padding:10px 12px;margin:8px 16px 0;
                flex:0 0 auto}
  .handoff-card .tag{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--purple);margin-bottom:4px}
  .handoff-card p{margin:0 0 8px;font-size:12px;white-space:pre-wrap}
  .handoff-card .folder{font-size:11px;color:var(--dim);margin-bottom:8px}
  .handoff-card .actions{display:flex;gap:8px}
  .handoff-card .inp{flex:1;border:1px solid var(--border);background:var(--panel2);color:var(--text);
                     border-radius:6px;padding:6px 8px;font-size:11px}
  .thread{flex:1;overflow-y:auto;padding:16px 18px;min-height:0;scroll-behavior:smooth}
  .ev{margin:0 0 10px;max-width:780px}
  .row-user{display:flex;justify-content:flex-end}
  .bubble{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
          padding:8px 12px;white-space:pre-wrap;word-break:break-word}
  .bubble.user{background:#0f2238;border-color:#1f3d63;max-width:70%}
  .bubble.agent{max-width:85%}
  .bubble .author{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--dim);
                  margin-bottom:3px}
  .bubble.user .author{color:var(--accent);text-align:right}
  .reason{color:var(--dim);font-style:italic;font-size:12px;padding-left:14px;
          border-left:2px solid #2a3442;margin-left:4px}
  .toolcard{border:1px solid var(--border);background:var(--panel);border-radius:8px;
            padding:8px 12px;margin-left:10px}
  .toolcard .tname{font-weight:700;font-size:12px;color:var(--accent)}
  .toolcard pre{background:#0a0e15;border:1px solid var(--border);border-radius:6px;
                padding:6px 8px;overflow-x:auto;font-size:11px;color:var(--dim);margin:6px 0 0}
  .toolcard .status{float:right;font-size:10px;font-weight:800;letter-spacing:.08em}
  .status.running{color:var(--accent)}.status.completed{color:var(--green)}
  .status.failed{color:var(--red)}.status.blocked{color:var(--amber)}
  .approval{border:1px solid #6b4d12;border-left:3px solid var(--amber);
            background:#171207;border-radius:8px;padding:10px 12px;margin-left:10px}
  .approval .tag{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--amber);margin-bottom:4px}
  .approval p{margin:0 0 8px;white-space:pre-wrap}
  .approval .actions{display:flex;gap:8px}
  .errcard{border:1px solid #5c1f1d;border-left:3px solid var(--red);background:#1a0e0d;
           border-radius:8px;padding:8px 12px;margin-left:10px;white-space:pre-wrap}
  .errcard .tag{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--red);margin-bottom:4px}
  .meta-line{color:var(--dim);font-size:11px;margin-left:10px}
  .meta-line .t{color:#3a4453}
  .composer{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);
            background:var(--panel)}
  .composer textarea{flex:1;resize:none;background:var(--panel2);color:var(--text);
                     border:1px solid var(--border);border-radius:10px;padding:10px 12px;
                     font:inherit;min-height:44px;max-height:120px}
  .composer textarea:focus{outline:0;border-color:var(--accent)}
  .composer .send{background:var(--accent);color:#000;border:0;border-radius:10px;
                  padding:0 20px;font-weight:800;cursor:pointer}
  .composer .send:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:11px;color:var(--dim);padding:4px 16px 0;background:var(--panel)}
  .cap{display:inline-block;border:1px solid var(--border);color:var(--dim);border-radius:20px;
       padding:2px 10px;font-size:11px;margin:0 6px 6px 0}
  .cap.created{border-color:var(--green);color:var(--green)}
  .addcap{background:var(--panel2);color:var(--accent);border:1px dashed var(--border);
          border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;
          font-family:inherit;margin-top:2px}
  .addcap:hover{border-color:var(--accent)}
  .nomodel{border:1px solid var(--amber);border-left:3px solid var(--amber);
           background:#171207;border-radius:8px;padding:8px 12px;margin:0 16px 8px;
           font-size:12px;color:var(--amber)}
  .mem{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
  .mem .lbl{flex:1}
  .mem .yes{color:var(--green)}.mem .no{color:#3a4453}
  .tool{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;margin-bottom:6px}
  .tool .tn{font-weight:700;font-size:12px;color:var(--accent)}
  .tool .td{color:var(--dim);font-size:11px;margin-top:2px}
  .empty{color:#3a4453;text-align:center;margin-top:40px;font-size:13px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#222c3a;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header class="topbar">
  <span class="project">VIDEO GENERATION SYSTEM</span>
  <span class="crumb">Agent Workspace &middot; <b id="crumbName">…</b></span>
  <span class="spacer"></span>
  <div class="mode-toggle" id="modeToggle">
    <button data-mode="plan" id="modePlan">PLAN</button>
    <button data-mode="build" id="modeBuild">BUILD</button>
  </div>
  <button class="btn danger" id="stopBtn" disabled>STOP</button>
</header>

<div class="layout">
  <aside class="side">
    <h3>SESSIONS</h3>
    <div class="sessions-list" id="sessionsList"><div class="empty" style="margin:8px 0">loading…</div></div>
    <div class="new-session">
      <input type="text" id="newSessionInput" placeholder="Task for new session…">
      <button id="newSessionBtn">NEW</button>
    </div>
    <h3>AGENT NETWORK</h3>
    <div id="agentNetwork"><div class="empty" style="margin:8px 0">loading…</div></div>
    <h3>PROJECT RESOURCES</h3>
    <nav class="proj-links">
      <a href="/">Agent Dashboard</a>
    </nav>
  </aside>

  <main>
    <div class="agent-head" id="agentHead">
      <h1 id="agentName">…</h1>
      <span class="role" id="agentRole">…</span>
      <span class="badge plan" id="modeBadge">PLAN MODE</span>
      <span class="badge" id="statusBadge">idle</span>
    </div>
    <div class="handoff-card" id="handoffCard" style="display:none"></div>
    <div class="thread" id="thread">
      <div class="empty">connecting…</div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="nomodel" id="noModel" style="display:none"></div>
    <div class="composer">
      <textarea id="input" placeholder="Message the agent…" disabled></textarea>
      <button class="send" id="sendBtn" disabled>SEND</button>
    </div>
  </main>

  <aside class="side right">
    <h3>ABOUT THIS AGENT</h3>
    <div id="about" style="color:var(--dim);font-size:12px">…</div>
    <h3>CAPABILITIES</h3>
    <div id="caps"></div>
    <button class="addcap" id="addCapBtn">+ Add Capability</button>
    <h3>MEMORY &amp; CONTEXT</h3>
    <div id="memory"></div>
    <h3>TOOLS &amp; RESOURCES</h3>
    <div id="toolsBox"></div>
  </aside>
</div>

<script>
const AGENT_ID = location.pathname.split('/').filter(Boolean).pop();
const $ = id => document.getElementById(id);
const seen = new Set();
let currentSessionId = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(ts){
  if(!ts) return '';
  const d = new Date(ts.endsWith('Z') || ts.includes('+') ? ts : ts + 'Z');
  return isNaN(d) ? ts : d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function key(ev){ return ev.type + '|' + (ev.timestamp||'') + '|' + String(ev.content||'').slice(0,120); }

function niceStatus(st){
  return ({idle:'Online', completed:'Online', stopped:'Online', failed:'Online',
           handed_off:'Handed off', working:'Active',
           waiting:'Needs your approval', stopping:'Active'}[st] || st || 'Online');
}
function dotClass(st){
  return ({working:'working', waiting:'waiting', handed_off:'handed_off'}[st] || 'idle');
}
function statusBadge(st){
  return '<span class="status ' + (st || 'running') + '">' + esc(st || 'running') + '</span>';
}

function renderEvent(ev){
  const k = key(ev);
  if(seen.has(k)) return;
  seen.add(k);
  const box = document.createElement('div');
  box.className = 'ev';
  const t = fmt(ev.timestamp);
  switch(ev.type){
    case 'user_message':
      box.className = 'ev row-user';
      box.innerHTML = '<div class="bubble user"><div class="author">YOU</div>' + esc(ev.content) + '</div>';
      break;
    case 'assistant_message':
      box.innerHTML = '<div class="bubble agent"><div class="author">' + esc(ev.agent_id||AGENT_ID) +
                      ' · ' + esc(t) + '</div>' + esc(ev.content).replace(/\n/g,'<br>') + '</div>';
      break;
    case 'reasoning_summary':
      box.innerHTML = '<div class="reason">' + esc(ev.content) + '</div>';
      break;
    case 'tool_call': {
      let args = '';
      try{ args = '<pre>' + esc(JSON.stringify(ev.tool && ev.tool.args, null, 1)) + '</pre>'; }catch(e){}
      box.innerHTML = '<div class="toolcard"><span class="status running">' + (ev.tool&&ev.tool.blocked?'blocked':'running') +
                      '</span><div class="tname">' + esc(ev.tool && ev.tool.name) + '</div>' +
                      (ev.content ? '<div style="color:var(--dim);font-size:11px;margin-top:2px">' + esc(ev.content) + '</div>' : '') +
                      args + '</div>';
      break;
    }
    case 'tool_result': {
      const st = (ev.tool && ev.tool.status) || 'completed';
      const stCls = st === 'blocked' ? 'blocked' : st;
      box.innerHTML = '<div class="toolcard">' + statusBadge(stCls) +
                      '<div class="tname">' + esc(ev.tool && ev.tool.name) + '</div>' +
                      (ev.content ? '<div style="color:var(--dim);font-size:11px;margin-top:2px">' + esc(ev.content) + '</div>' : '') +
                      '</div>';
      break;
    }
    case 'approval_request':
      box.innerHTML = '<div class="approval"><div class="tag">APPROVAL REQUIRED</div><p>' + esc(ev.approval && ev.approval.description) +
                      '</p><div class="actions">' +
                      '<button class="btn ok" onclick="answerApproval(\'approve\')">APPROVE</button>' +
                      '<button class="btn danger" onclick="answerApproval(\'rejected\')">REJECT</button></div></div>';
      break;
    case 'approval_result':
      box.innerHTML = '<div class="meta-line">approval ' + esc(ev.approval && ev.approval.status) +
                      ' &middot; <span class="t">' + esc(t) + '</span></div>';
      break;
    case 'handoff_request':
      box.innerHTML = '<div class="handoff-card" style="margin:0 0 0 10px"><div class="tag">HANDOFF REQUESTED</div>' +
                      '<p>' + esc(ev.handoff ? 'to ' + esc(ev.handoff.target) + ': ' + ev.handoff.prompt : ev.content) + '</p></div>';
      break;
    case 'handoff_result':
      box.innerHTML = '<div class="meta-line">handoff ' + esc(ev.content) + ' &middot; <span class="t">' + esc(t) + '</span></div>';
      break;
    case 'error':
      box.innerHTML = '<div class="errcard"><div class="tag">ERROR</div>' + esc(ev.content) + '</div>';
      break;
    case 'status':
    default:
      box.innerHTML = '<div class="meta-line">' + esc(ev.content) + ' &middot; <span class="t">' + esc(t) + '</span></div>';
      break;
  }
  $('thread').appendChild(box);
}

function nearBottom(){
  const th = $('thread');
  return th.scrollHeight - th.scrollTop - th.clientHeight < 120;
}
function scrollIfNeeded(){ if(nearBottom()) $('thread').scrollTop = $('thread').scrollHeight; }

async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(body||{})});
  let data = {};
  try{ data = await r.json(); }catch(e){}
  return {status:r.status, data};
}
async function del(path){
  const r = await fetch(path, {method:'DELETE'});
  let data = {};
  try{ data = await r.json(); }catch(e){}
  return {status:r.status, data};
}

function renderHandoffCard(snap){
  const card = $('handoffCard');
  const ho = snap.active_session && snap.active_session.pending_handoff;
  if(!ho){ card.style.display = 'none'; card.innerHTML = ''; return; }
  card.style.display = 'block';
  card.innerHTML = '<div class="tag">HANDOFF AWAITING YOUR DECISION</div>' +
    '<p><b>To ' + esc(ho.target) + ':</b> ' + esc(ho.prompt) + '</p>' +
    '<div class="folder">package: data/runs/' + esc(ho.run_id) + '/</div>' +
    '<input class="inp" id="handoffNote" placeholder="Redirect instructions (optional)…">' +
    '<div class="actions" style="margin-top:8px">' +
    '<button class="btn ok" onclick="resolveHandoff(\'accept\')">ACCEPT</button>' +
    '<button class="btn" onclick="resolveHandoff(\'reject\')">REJECT</button>' +
    '<button class="btn" onclick="resolveHandoff(\'redirect\')">REDIRECT</button></div>';
}

function applySnapshot(snap){
  const active = snap.active_session;
  $('crumbName').textContent = snap.agent.name;
  $('agentName').textContent = snap.agent.name;
  $('agentRole').textContent = snap.agent.description || '';
  const mode = active ? active.mode : 'plan';
  $('modeBadge').textContent = (mode === 'build' ? 'BUILD MODE' : 'PLAN MODE');
  $('modeBadge').className = 'badge ' + mode;
  const st = active ? active.status : 'idle';
  $('statusBadge').textContent = niceStatus(st);
  $('statusBadge').className = 'badge' + (st === 'working' || st === 'waiting' ? ' live' : '');

  $('modePlan').classList.toggle('active', mode === 'plan');
  $('modeBuild').classList.toggle('active', mode === 'build');

  const running = !!(active && active.can_stop);
  $('stopBtn').disabled = !running;
  $('input').disabled = running;
  $('sendBtn').disabled = running;
  $('hint').textContent = running
    ? 'The agent is working. Stop is a real cancellation of this session.'
    : (mode === 'plan'
       ? 'Plan Mode: the agent talks and plans — actions pause for your approval. Switch to Build Mode to let it work autonomously.'
       : 'Build Mode: the agent works autonomously within its permissions; you can stop it at any time.');

  $('noModel').style.display = snap.model_configured === false ? 'block' : 'none';
  $('noModel').textContent = snap.model_configured === false
    ? 'The conversational layer is not configured — the agent cannot reply until an API key is added.'
    : '';

  $('about').textContent = snap.agent.identity || '';
  $('caps').innerHTML = (snap.agent.capabilities || []).map(c =>
    '<span class="cap' + (c.created ? ' created' : '') + '">' +
    (c.created ? '&#10003; ' : '') + esc(c.name) + '</span>').join('')
    || '<div class="empty" style="margin:0">no capabilities yet</div>';
  $('memory').innerHTML = (active && active.memory || []).map(m =>
    '<div class="mem"><span class="' + (m.available ? 'yes' : 'no') + '">' +
    (m.available ? '&#10003;' : '&#8226;') + '</span><span class="lbl">' + esc(m.label) +
    '</span></div>').join('') || '<div class="empty" style="margin:0">no project context yet</div>';
  $('toolsBox').innerHTML = (snap.agent.tools || []).map(t =>
    '<div class="tool"><div class="tn">' + esc(t.name) + '</div>' +
    (t.doc ? '<div class="td">' + esc(t.doc) + '</div>' : '') + '</div>').join('')
    || '<div class="empty" style="margin:0">no tools yet</div>';

  renderSessions(snap);
  renderHandoffCard(snap);

  seen.clear();
  $('thread').innerHTML = '';
  if(active && active.conversation && active.conversation.length){
    (active.conversation).forEach(renderEvent);
  } else {
    $('thread').innerHTML = '<div class="empty">the conversation is empty — say hello</div>';
  }
  $('thread').scrollTop = $('thread').scrollHeight;
}

function renderSessions(snap){
  const list = snap.sessions || [];
  $('sessionsList').innerHTML = list.length ? list.map(s =>
    '<div class="session-item' + (s.id === snap.active_session_id ? ' active' : '') + '">' +
    '<span class="sdot ' + dotClass(s.status) + '"></span>' +
    '<span class="stitle" title="' + esc(s.title) + '">' + esc(s.title) + '</span>' +
    (s.handoff_pending ? '<span class="sstatus">handoff</span>' : '') +
    '<span class="sactions">' +
    (s.id !== snap.active_session_id
      ? '<button class="sbtn" onclick="activateSession(\'' + s.id + '\')">open</button>' +
        '<button class="sbtn" onclick="deleteSession(\'' + s.id + '\')">del</button>'
      : '') +
    '</span></div>').join('')
    : '<div class="empty" style="margin:8px 0">no sessions yet</div>';
}

async function activateSession(sid){
  const {data} = await post('/api/studio/agents/' + AGENT_ID + '/sessions/' + sid + '/activate');
  if(data.ok){ currentSessionId = sid; loadSnapshot(); }
}
async function deleteSession(sid){
  const {data} = await del('/api/studio/agents/' + AGENT_ID + '/sessions/' + sid);
  if(data.ok){ currentSessionId = null; loadSnapshot(); }
}
async function newSession(){
  const input = $('newSessionInput');
  const task = input.value.trim();
  if(!task) return;
  const {data} = await post('/api/studio/agents/' + AGENT_ID + '/sessions', {task, mode: 'plan'});
  if(data.ok){ input.value = ''; currentSessionId = data.session_id; loadSnapshot(); }
}

async function loadSnapshot(){
  try{
    const r = await fetch('/api/studio/agents/' + AGENT_ID + (currentSessionId ? '?session_id=' + currentSessionId : ''));
    if(!r.ok) return;
    const snap = await r.json();
    if(!currentSessionId) currentSessionId = snap.active_session_id;
    applySnapshot(snap);
  }catch(e){}
}

async function loadNetwork(){
  try{
    const r = await fetch('/api/studio/dashboard');
    const snap = await r.json();
    $('agentNetwork').innerHTML = (snap.agents || []).map(a =>
      '<div class="nav-agent' + (a.id === AGENT_ID ? ' active' : '') +
      '" onclick="location=\'/workspace/' + encodeURIComponent(a.id) + '\'">' +
      '<span class="dot ' + dotClass(a.status || 'idle') + '"></span>' +
      '<span class="nm">' + esc(a.name) + '</span>' +
      '<span class="st">' + esc(niceStatus(a.status || 'idle')) + '</span></div>').join('');
  }catch(e){}
}

async function sendMessage(){
  const input = $('input');
  const msg = input.value.trim();
  if(!msg) return;
  input.value = '';
  input.disabled = true; $('sendBtn').disabled = true;
  const {data} = await post('/api/studio/agents/' + AGENT_ID + '/messages',
                            {message: msg, session_id: currentSessionId});
  if(!data.ok) input.value = msg;
}

async function setMode(mode){
  const {data} = await post('/api/studio/agents/' + AGENT_ID + '/mode',
                            {mode, session_id: currentSessionId});
  if(data.ok) loadSnapshot();
}

async function stopRun(){
  const {data} = await post('/api/studio/agents/' + AGENT_ID + '/stop',
                            {session_id: currentSessionId});
  if(!data.ok) return;
  $('stopBtn').disabled = true;
}

async function answerApproval(answer){
  await post('/api/studio/agents/' + AGENT_ID + '/approval',
             {session_id: currentSessionId, answer});
}

async function resolveHandoff(decision){
  const note = $('handoffNote') ? $('handoffNote').value.trim() : '';
  const {data} = await post('/api/studio/agents/' + AGENT_ID + '/handoff',
                            {session_id: currentSessionId, decision, note});
  if(data.ok) loadSnapshot();
}

function connectEvents(){
  const es = new EventSource('/api/studio/agents/' + AGENT_ID + '/events');
  es.addEventListener('error', () => { es.close(); setTimeout(connectEvents, 1500); });
  ['user_message','assistant_message','reasoning_summary','tool_call',
   'tool_result','approval_request','approval_result','handoff_request',
   'handoff_result','error','status'].forEach(t => {
    es.addEventListener(t, ev => {
      try{ renderEvent(JSON.parse(ev.data)); scrollIfNeeded(); }catch(e){}
    });
  });
}

$('sendBtn').onclick = sendMessage;
$('addCapBtn').onclick = () => {
  const input = $('input');
  input.focus();
  input.value = 'I want you to be able to ';
  const end = input.value.length;
  input.setSelectionRange(end, end);
};
$('input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
$('modePlan').onclick = () => setMode('plan');
$('modeBuild').onclick = () => setMode('build');
$('stopBtn').onclick = stopRun;
$('newSessionBtn').onclick = newSession;
$('newSessionInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); newSession(); }
});

let lastSig = '';
setInterval(async () => {
  try{
    const r = await fetch('/api/studio/agents/' + AGENT_ID + (currentSessionId ? '?session_id=' + currentSessionId : ''));
    const snap = await r.json();
    const active = snap.active_session || {};
    const sig = JSON.stringify([active.status, active.can_stop, active.mode,
                                (active.conversation || []).length,
                                (snap.sessions || []).length, snap.active_session_id]);
    if(sig !== lastSig){ lastSig = sig; applySnapshot(snap); }
  }catch(e){}
}, 2500);

loadSnapshot();
loadNetwork();
connectEvents();
setInterval(loadNetwork, 15000);
</script>
</body>
</html>
