<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<style>
  :root{
    --bg:#07090f; --panel:#0e1219; --border:#1c2530; --text:#f4f5f8;
    --dim:#7d8896; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
    --amber:#d29922; --purple:#a371f7; --panel2:#11161f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;padding-bottom:40px}
  a{color:var(--accent);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 24px;
          background:var(--panel);border-bottom:1px solid var(--border);
          position:sticky;top:0;z-index:10}
  .project{font-weight:800;letter-spacing:.12em;font-size:11px;color:var(--dim)}
  .page-title{font-size:16px;font-weight:700}
  .spacer{flex:1}
  .pill{border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:11px;
        color:var(--dim);display:flex;align-items:center;gap:6px}
  .pill.warn{border-color:var(--amber);color:var(--amber)}
  .pill.bad{border-color:var(--red);color:var(--red)}
  .pill.ok{border-color:var(--green);color:var(--green)}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 24px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
        padding:16px 18px}
  .card .k{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:800;margin-bottom:6px}
  .card .v{font-size:26px;font-weight:800}
  .card .v small{font-size:12px;color:var(--dim);font-weight:600}
  .card p{margin:6px 0 0;color:var(--dim);font-size:12px}
  .h2{font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:800;
      margin:28px 0 12px;display:flex;align-items:center;gap:8px}
  .h2 .count{background:var(--panel2);border:1px solid var(--border);border-radius:20px;
             padding:1px 9px;font-size:11px;color:var(--text)}
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .agent{background:var(--panel);border:1px solid var(--border);border-radius:12px;
         padding:14px 16px;cursor:pointer;transition:border-color .15s}
  .agent:hover{border-color:var(--accent)}
  .agent .top{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.idle{background:#3a4453}
  .dot.working{background:var(--accent);animation:pulse 1.2s infinite}
  .dot.waiting{background:var(--amber);animation:pulse 1.2s infinite}
  .dot.handed_off{background:var(--purple)}
  @keyframes pulse{50%{opacity:.35}}
  .agent .name{font-weight:700;font-size:14px}
  .agent .status{font-size:11px;color:var(--dim)}
  .agent .desc{color:var(--dim);font-size:12px;margin:8px 0}
  .agent .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:var(--panel2);border:1px solid var(--border);border-radius:20px;
       padding:2px 10px;font-size:10px;color:var(--dim)}
  .tag.blue{border-color:#1f3d63;color:var(--accent)}
  .tag.purple{border-color:#3a2a5c;color:var(--purple)}
  .tag.green{border-color:#1c4530;color:var(--green)}
  .tag.amber{border-color:#5c4a12;color:var(--amber)}
  .agent .stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;
                border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
  .agent .stats b{color:var(--text)}
  .feed{display:flex;flex-direction:column;gap:2px}
  .feed-item{display:flex;gap:12px;padding:9px 4px;border-bottom:1px solid var(--border)}
  .feed-item:last-child{border-bottom:0}
  .feed-item .tm{color:#3a4453;font-size:11px;flex:0 0 auto;width:70px;padding-top:1px}
  .feed-item .msg{font-size:12px;color:var(--dim);min-width:0;word-break:break-word}
  .feed-item .msg b{color:var(--text)}
  .empty{color:#3a4453;text-align:center;padding:40px 0;font-size:13px}
  .banner{border:1px solid var(--amber);border-left:3px solid var(--amber);background:#171207;
          border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--amber)}
  .banner.bad{border-color:var(--red);border-left-color:var(--red);background:#1a0e0d;color:var(--red)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#222c3a;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header class="topbar">
  <span class="project">VIDEO GENERATION SYSTEM</span>
  <span class="page-title">Agent Dashboard</span>
  <span class="spacer"></span>
  <span class="pill" id="modelPill" title="Conversational layer">model —</span>
  <span class="pill" id="clock">—</span>
</header>

<div class="wrap">
  <div class="banner" id="modelBanner" style="display:none"></div>

  <div class="row">
    <div class="card"><div class="k">TOTAL AGENTS</div><div class="v" id="statAgents">—</div>
      <p>The full organization chart, one workspace each.</p></div>
    <div class="card"><div class="k">TOTAL SESSIONS</div><div class="v" id="statSessions">—</div>
      <p>In-flight and past sessions across every agent.</p></div>
    <div class="card"><div class="k">ATTENTION</div><div class="v" id="statAttention">—</div>
      <p>Agents currently waiting on you: approvals or handoffs.</p></div>
  </div>

  <div class="h2">AGENTS <span class="count" id="agentsCount">—</span></div>
  <div class="agents" id="agents">
    <div class="empty">loading…</div>
  </div>

  <div class="h2">RECENT ACTIVITY</div>
  <div class="card" style="padding:8px 14px">
    <div class="feed" id="feed">
      <div class="empty">loading…</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const seenActivity = new Set();

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(ts){
  if(!ts) return '';
  const d = new Date(ts.endsWith('Z') || ts.includes('+') ? ts : ts + 'Z');
  return isNaN(d) ? ts : d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
}
function clock(){ $('clock').textContent = new Date().toLocaleTimeString(); }

function niceStatus(st){
  return ({idle:'Online', completed:'Online', stopped:'Online', failed:'Online',
           handed_off:'Handed off', working:'Active',
           waiting:'Needs your attention', stopping:'Active'}[st] || st || 'Online');
}
function dotClass(st){
  return ({working:'working', waiting:'waiting', handed_off:'handed_off'}[st] || 'idle');
}
function tierTag(t){
  const map = {ceo:['CEO', 'amber'], executive:['EXEC', 'green'],
               specialist:['SPECIALIST', 'blue'], worker:['WORKER', '']};
  const m = map[t] || [String(t || '').toUpperCase(), ''];
  return '<span class="tag' + (m[1] ? ' ' + m[1] : '') + '">' + m[0] + '</span>';
}

function applySnapshot(snap){
  const sys = snap.system || {};
  const agents = snap.agents || [];
  const activity = snap.recent_activity || [];

  $('statAgents').textContent = sys.total_agents || 0;
  $('statSessions').textContent = sys.total_sessions || 0;
  $('statAttention').textContent = sys.attention_agents || 0;
  $('agentsCount').textContent = agents.length;
  $('statAttention').style.color = (sys.attention_agents || 0) > 0 ? 'var(--amber)' : '';

  const modelOk = sys.model_configured !== false;
  const pill = $('modelPill');
  pill.textContent = modelOk ? 'model ready' : 'model missing';
  pill.className = 'pill' + (modelOk ? ' ok' : ' bad');
  const banner = $('modelBanner');
  banner.style.display = modelOk ? 'none' : 'block';
  banner.textContent = modelOk ? '' :
    'The conversational layer is not configured — agents cannot reply. Add an LLM API key to continue working with them.';
  banner.className = 'banner' + (modelOk ? '' : ' bad');

  $('agents').innerHTML = agents.length ? agents.map(a =>
    '<div class="agent" onclick="location=\'/workspace/' + encodeURIComponent(a.id) + '\'">' +
      '<div class="top">' +
        '<span class="dot ' + dotClass(a.status || 'idle') + '"></span>' +
        '<span class="name">' + esc(a.name) + '</span>' +
        '<span class="status">' + esc(niceStatus(a.status || 'idle')) + '</span>' +
      '</div>' +
      '<div class="desc">' + esc(a.description || '') + '</div>' +
      '<div class="tags">' +
        (a.department ? '<span class="tag">' + esc(a.department) + '</span>' : '') +
        tierTag(a.tier) +
        (a.handoff_pending ? '<span class="tag purple">handoff</span>' : '') +
      '</div>' +
      '<div class="stats">' +
        '<span><b>' + (a.session_count || 0) + '</b> sessions</span>' +
        (a.last_activity_at ? '<span>last activity ' + esc(fmt(a.last_activity_at)) + '</span>' : '') +
      '</div>' +
    '</div>').join('')
    : '<div class="empty">no agents found</div>';

  const list = activity.slice(0, 30);
  $('feed').innerHTML = list.length ? list.map(ev => {
    const k = ev.agent_id + '|' + ev.timestamp + '|' + ev.message;
    seenActivity.add(k);
    return '<div class="feed-item"><span class="tm">' + esc(fmt(ev.timestamp)) + '</span>' +
           '<span class="msg"><b>' + esc(ev.agent_name) + '</b> — ' + esc(ev.message) + '</span></div>';
  }).join('') : '<div class="empty">no activity yet</div>';
}

async function load(){
  try{
    const r = await fetch('/api/studio/dashboard');
    if(!r.ok) return;
    applySnapshot(await r.json());
  }catch(e){}
}

function connectEvents(){
  const es = new EventSource('/api/studio/events');
  es.addEventListener('error', () => { es.close(); setTimeout(connectEvents, 1500); });
  es.addEventListener('activity_created', () => load());
}

clock(); setInterval(clock, 1000);
load();
connectEvents();
setInterval(load, 5000);
</script>
</body>
</html>
